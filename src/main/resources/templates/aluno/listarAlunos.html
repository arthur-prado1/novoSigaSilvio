<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'aluno-listar', ~{::content})}">
<head>
    <title>Lista de Alunos | Novo SIGA</title>
</head>
<body>
    <div th:fragment="content">
        <div>
            <h1>Lista de Alunos</h1>
            <p>
                <span th:text="${#lists.size(alunos)}">0</span> registros encontrados na base.
            </p>
            <p>
                <a th:href="@{/alunos/criar}">Novo Aluno</a>
            </p>
        </div>

        <div th:if="${not #lists.isEmpty(alunos)}">
            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Foto</th>
                        <th>Aluno</th>
                        <th>Curso</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>Cidade/UF</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno : ${alunos}">
                        <td th:text="${aluno.idAluno}"></td>
                        <td>
                            <img th:if="${aluno.fotoAluno != null}"
                                 th:src="@{/alunos/foto/{id}(id=${aluno.idAluno})}"
                                 alt="Foto do Aluno"
                                 width="50">
                            <span th:if="${aluno.fotoAluno == null}">Sem foto</span>
                        </td>
                        <td th:text="${aluno.nomeAluno}"></td>
                        <td>
                            <span th:if="${aluno.curso != null}" th:text="${aluno.curso.nomeCurso}"></span>
                            <span th:if="${aluno.curso == null}">Sem curso</span>
                        </td>
                        <td th:text="${aluno.cpfAluno}"></td>
                        <td th:text="${aluno.telefoneAluno}"></td>
                        <td>
                            <span th:text="${aluno.cidadeAluno}"></span>/<span th:text="${aluno.estadoAluno}"></span>
                        </td>
                        <td>
                            <a th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}">Editar</a>
                            |
                            <a th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}"
                               onclick="return confirm('Deseja realmente excluir este aluno?')">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(alunos)}">
            <h3>Nenhum aluno cadastrado</h3>
            <p>Não existem registros de alunos na base.</p>
            <p><a th:href="@{/alunos/criar}">Cadastrar Aluno</a></p>
        </div>
    </div>
</body>
</html>
