<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'aluno-listar', ~{::content})}">
<head>
    <title>Lista de Alunos | Novo SIGA</title>
</head>
<body>
    <div th:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div>
                <h1>Lista de Alunos</h1>
                <p style="margin-bottom: 0;">
                    <strong th:text="${#lists.size(alunos)}">0</strong> alunos cadastrados no sistema.
                </p>
            </div>
            <div>
                <a th:href="@{/alunos/criar}" class="btn-new">+ Novo Aluno</a>
            </div>
        </div>

        <div class="table-container" th:if="${not #lists.isEmpty(alunos)}">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th style="width: 70px;">Foto</th>
                        <th>Nome do Aluno</th>
                        <th>Curso</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>Cidade / UF</th>
                        <th style="width: 150px; text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno : ${alunos}">
                        <td th:text="${aluno.idAluno}"></td>
                        <td>
                            <img th:if="${aluno.fotoAluno != null}"
                                 th:src="@{/alunos/foto/{id}(id=${aluno.idAluno})}"
                                 alt="Foto do Aluno"
                                 width="45"
                                 height="45"
                                 style="border-radius: 50%; object-fit: cover;">
                            <span th:if="${aluno.fotoAluno == null}" style="color: #94a3b8; font-size: 12px;">Sem foto</span>
                        </td>
                        <td><strong th:text="${aluno.nomeAluno}"></strong></td>
                        <td>
                            <span th:if="${aluno.curso != null}" th:text="${aluno.curso.nomeCurso}"></span>
                            <span th:if="${aluno.curso == null}" style="color: #94a3b8; font-style: italic;">Sem curso</span>
                        </td>
                        <td th:text="${aluno.cpfAluno}"></td>
                        <td th:text="${aluno.telefoneAluno}"></td>
                        <td>
                            <span th:text="${aluno.cidadeAluno}"></span> / <span th:text="${aluno.estadoAluno}"></span>
                        </td>
                        <td style="text-align: center;">
                            <div style="display: inline-flex; gap: 6px;">
                                <a th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}" class="btn-edit">Editar</a>
                                <a th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}"
                                   class="btn-delete"
                                   onclick="return confirm('Deseja realmente excluir este aluno?')">Excluir</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(alunos)}" style="text-align: center; padding: 40px 20px;">
            <h3>Nenhum aluno cadastrado</h3>
            <p>Não existem registros de alunos no momento.</p>
            <p><a th:href="@{/alunos/criar}" class="btn-new">+ Cadastrar Primeiro Aluno</a></p>
        </div>
    </div>
</body>
</html>
